<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Transmissão Overlay</title>
    <link id="google-font-link" rel="stylesheet" href="">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent !important;
            font-family: var(--font-family, 'Inter'), -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            position: relative;
            color: #fff;
        }

        body.paused {
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        body.chroma-green {
            background: #00FF00 !important;
        }

        body.chroma-blue {
            background: #0000FF !important;
        }

        body.chroma-magenta {
            background: #FF00FF !important;
        }

        :root {
            --primary: #7c3aed;
            --accent: #fbbf24;
            --text: #ffffff;
            --tx-fast: 0ms;
            --tx-mid: 0ms;
        }

        body.fade-on {
            --tx-fast: 400ms;
            --tx-mid: 600ms;
        }

        /* ─── POSIÇÕES ──────────────────────────────────────────────── */
        .pos-top-left {
            top: 32px;
            left: 32px;
            right: auto;
            bottom: auto;
        }

        .pos-top-right {
            top: 32px;
            right: 32px;
            left: auto;
            bottom: auto;
        }

        .pos-bottom-left {
            bottom: 32px;
            left: 32px;
            top: auto;
            right: auto;
        }

        .pos-bottom-right {
            bottom: 32px;
            right: 32px;
            top: auto;
            left: auto;
        }

        /* ─── WATERMARK ─────────────────────────────────────────────── */
        .watermark {
            position: absolute;
            z-index: 100;
            pointer-events: none;
            transition: opacity var(--tx-fast) ease;
        }

        .watermark img {
            height: 80px;
            width: auto;
            max-width: 200px;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
        }

        /* ─── RELÓGIO ───────────────────────────────────────────────── */
        .clock {
            position: absolute;
            z-index: 90;
            font-family: 'JetBrains Mono', monospace;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
            color: var(--text);
        }

        /* ─── SPEAKER CARD ──────────────────────────────────────────── */
        .speaker-card {
            position: absolute;
            z-index: 200;
            display: none;
            /* HIDDEN POR PADRÃO */
            align-items: stretch;
            max-width: 60%;
            overflow: hidden;
            opacity: 0;
            transform: translateX(-100%);
            transition:
                opacity var(--tx-fast),
                transform var(--tx-mid) cubic-bezier(0.22, 1, 0.36, 1);
            color: var(--text);
        }

        .speaker-card.visible {
            display: flex;
            opacity: 1;
            transform: translateX(0);
        }

        /* Posicionamento dinâmico */
        .speaker-card.text-pos-lower-third {
            bottom: 80px;
            left: 0;
        }

        .speaker-card.text-pos-lower-half {
            bottom: 50%;
            left: 0;
            transform: translateY(50%) translateX(-100%);
        }

        .speaker-card.text-pos-lower-half.visible {
            transform: translateY(50%) translateX(0);
        }

        .speaker-card.text-pos-top-banner {
            top: 80px;
            left: 0;
        }

        .speaker-card.text-pos-fullscreen {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            max-width: 80%;
            text-align: center;
        }

        .speaker-card.text-pos-fullscreen.visible {
            transform: translate(-50%, -50%) scale(1);
        }

        .speaker-accent {
            width: 8px;
            background: var(--accent);
            flex-shrink: 0;
        }

        .speaker-content {
            padding: 18px 36px;
            flex-grow: 1;
        }

        .speaker-name {
            font-size: 34px;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.01em;
        }

        .speaker-role {
            font-size: 19px;
            font-weight: 400;
            opacity: 0.85;
            margin-top: 4px;
        }

        /* ─── ESTILOS DO LOWER THIRD ────────────────────────────────── */
        .speaker-card.style-minimal {
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.5) 60%, transparent);
            border-bottom: 2px solid var(--accent);
        }

        .speaker-card.style-minimal .speaker-accent {
            display: none;
        }

        .speaker-card.style-modern {
            background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 60%, black));
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border-radius: 0 8px 8px 0;
        }

        .speaker-card.style-bold {
            background: var(--primary);
            box-shadow: 0 0 0 4px var(--accent);
        }

        .speaker-card.style-bold .speaker-accent {
            display: none;
        }

        .speaker-card.style-bold .speaker-name {
            font-size: 40px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .speaker-card.style-elegant {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--accent);
            border-left: 6px solid var(--accent);
            backdrop-filter: blur(12px);
            margin-left: 32px;
            border-radius: 4px;
        }

        .speaker-card.style-elegant .speaker-accent {
            display: none;
        }

        .speaker-card.style-elegant .speaker-name {
            font-style: italic;
            font-weight: 600;
        }

        /* ─── VERSE TICKER ──────────────────────────────────────────── */
        .verse-ticker {
            position: absolute;
            z-index: 150;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 16px 28px;
            font-size: 22px;
            line-height: 1.3;
            opacity: 0;
            transition:
                opacity var(--tx-fast),
                transform var(--tx-mid) cubic-bezier(0.22, 1, 0.36, 1);
            color: var(--text);
            pointer-events: none;
        }

        /* Regra geral de visibilidade (independente da posição) */
        .verse-ticker.visible {
            opacity: 1;
        }

        /* ─── VERSE-TEXT BASE ────────────────────────────────────────
         * .verse-text-wrap  = flex item que recebe a largura disponível
         * .verse-text       = span inline dentro do wrap
         *
         * min-width:0 no wrap é ESSENCIAL: flex items por padrão não
         * encolhem abaixo do min-content, o que impede a quebra de linha.
         * ────────────────────────────────────────────────────────── */
        .verse-ticker .verse-text-wrap {
            flex: 1;
            min-width: 0;
            /* permite encolher e quebrar */
        }

        .verse-ticker .verse-text {
            /* inline: necessário pro box-decoration-break funcionar
               em múltiplas linhas (text-only usa isso) */
            display: inline;
            word-break: break-word;
            white-space: normal;
            /* wrap-off padrão: quebra, sem elipse */
        }

        .verse-ticker.wrap-on .verse-text {
            white-space: pre-wrap;
            /* respeita \n explícitos */
        }

        /* ─── gradient ────────────────────────────────────────────── */
        .verse-ticker.bg-gradient {
            background: linear-gradient(90deg,
                    rgba(0, 0, 0, 0.92), rgba(0, 0, 0, 0.75) 70%, rgba(0, 0, 0, 0.4));
            border-left: 4px solid var(--primary);
            backdrop-filter: blur(8px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* ─── semi-transparent ─────────────────────────────────────── */
        .verse-ticker.bg-semi-transparent {
            background: rgba(0, 0, 0, 0.6);
            border-left: 4px solid var(--primary);
            backdrop-filter: blur(6px);
        }

        /* ─── none ─────────────────────────────────────────────────── */
        .verse-ticker.bg-none {
            background: transparent;
            border-left: none;
            box-shadow: none;
        }

        .verse-ticker.bg-none .verse-text {
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.98), 0 1px 3px rgba(0, 0, 0, 0.95);
        }

        /* ─── box-behind ────────────────────────────────────────────
         * O container não tem fundo. A caixa abraça apenas o conteúdo.
         * Solução: tornar o container inline-flex e posicionar por left.
         * ────────────────────────────────────────────────────────── */
        .verse-ticker.bg-box-behind {
            background: transparent;
            border-left: none;
            box-shadow: none;
            padding: 0;
            /* inline-flex: o container encolhe pro conteúdo */
            display: inline-flex;
            /* max-width pra não sair da tela; left já vem das classes
               de posição (.text-pos-lower-third etc.) */
            max-width: calc(100% - 64px);
        }

        .verse-ticker.bg-box-behind .verse-icon {
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.85);
            padding: 14px 14px;
            border-radius: 6px 0 0 6px;
            box-shadow: -4px 6px 20px rgba(0, 0, 0, 0.4);
        }

        .verse-ticker.bg-box-behind .verse-text-wrap {
            /* max-content: o wrap só ocupa o necessário pro texto */
            flex: 0 1 max-content;
            min-width: 0;
            max-width: 100%;
        }

        .verse-ticker.bg-box-behind .verse-text {
            display: block;
            background: rgba(0, 0, 0, 0.85);
            padding: 14px 22px;
            border-radius: 0 6px 6px 0;
            border-left: 4px solid var(--primary);
            box-shadow: 4px 6px 20px rgba(0, 0, 0, 0.4);
            white-space: normal;
            word-break: break-word;
        }

        /* wrap-on no box-behind: respeita \n explícitos */
        .verse-ticker.bg-box-behind.wrap-on .verse-text {
            white-space: pre-wrap;
        }

        /* ─── text-only ──────────────────────────────────────────────
         * Sem ícone. Container transparente.
         * O span .verse-text é inline com box-decoration-break:clone
         * → cada linha de texto recebe seu próprio fundo individualmente.
         * ────────────────────────────────────────────────────────── */
        .verse-ticker.bg-text-only {
            background: transparent;
            border-left: none;
            box-shadow: none;
            padding: 16px 32px;
        }

        /* Esconde o ícone — não faz parte do visual text-only */
        .verse-ticker.bg-text-only .verse-icon {
            display: none !important;
        }

        .verse-ticker.bg-text-only .verse-text-wrap {
            flex: 1;
            min-width: 0;
        }

        .verse-ticker.bg-text-only .verse-text {
            /* inline é OBRIGATÓRIO pro box-decoration-break funcionar */
            display: inline;
            background: rgba(0, 0, 0, 0.78);
            /* padding vertical cria o espaço entre as linhas "marcadas" */
            padding: 0.25em 0.6em;
            border-left: 3px solid var(--primary);
            /* clone replica padding+background em cada linha */
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
            line-height: 1.9;
            /* espaço entre linhas pra não colidir */
            border-radius: 2px;
        }

        .verse-ticker.style-minimal {
            font-weight: 400;
        }

        .verse-ticker.style-minimal .verse-text {
            font-style: normal;
        }

        .verse-ticker.style-modern {
            /* Default — sem mudanças */
        }

        .verse-ticker.style-bold {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-size: 24px;
        }

        .verse-ticker.style-bold .verse-text {
            font-style: normal;
        }

        .verse-ticker.style-bold.bg-gradient,
        .verse-ticker.style-bold.bg-semi-transparent,
        .verse-ticker.style-bold.bg-box-behind .verse-text {
            border-left-color: var(--accent);
            border-left-width: 6px;
        }

        .verse-ticker.style-elegant {
            font-style: italic;
        }

        .verse-ticker.style-elegant.bg-gradient,
        .verse-ticker.style-elegant.bg-semi-transparent,
        .verse-ticker.style-elegant.bg-box-behind .verse-text {
            border-left-color: var(--accent);
        }

        .verse-ticker.style-elegant .verse-text {
            font-weight: 500;
        }

        /* ─── POSIÇÕES DO VERSE-TICKER ──────────────────────────────── */
        .verse-ticker.text-pos-lower-third {
            bottom: 32px;
            left: 32px;
            right: 32px;
            transform: translateY(40px);
        }

        .verse-ticker.text-pos-lower-third.visible {
            transform: translateY(0);
        }

        .verse-ticker.text-pos-lower-half {
            bottom: 50%;
            left: 32px;
            right: 32px;
            transform: translateY(calc(50% + 40px));
        }

        .verse-ticker.text-pos-lower-half.visible {
            transform: translateY(50%);
        }

        .verse-ticker.text-pos-top-banner {
            top: 32px;
            left: 32px;
            right: 32px;
            transform: translateY(-40px);
        }

        .verse-ticker.text-pos-top-banner.visible {
            transform: translateY(0);
        }

        .verse-ticker.text-pos-fullscreen {
            top: 50%;
            left: 50%;
            right: auto;
            bottom: auto;
            width: min(85%, 1200px);
            max-height: 80vh;
            padding: 48px 64px;
            font-size: 38px;
            line-height: 1.4;
            text-align: center;
            justify-content: center;
            transform: translate(-50%, -50%) scale(0.9);
        }

        .verse-ticker.text-pos-fullscreen.visible {
            transform: translate(-50%, -50%) scale(1);
        }

        /* Fullscreen + gradient/semi-transparent → caixa centrada com bordas */
        .verse-ticker.text-pos-fullscreen.bg-gradient,
        .verse-ticker.text-pos-fullscreen.bg-semi-transparent {
            background: linear-gradient(135deg,
                    rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.85));
            border-left: none;
            border-top: 4px solid var(--primary);
            border-bottom: 4px solid var(--primary);
        }

        .verse-ticker.text-pos-fullscreen .verse-icon {
            font-size: 48px;
        }

        body.has-speaker-lower .verse-ticker.text-pos-lower-third {
            bottom: 200px;
        }

        .verse-icon {
            font-size: 28px;
            flex-shrink: 0;
        }

        /* verse-text é inline por padrão — os modos que precisam de
           block (box-behind) sobrescrevem explicitamente */
        .verse-text {
            font-style: italic;
            /* Sem flex-grow aqui — cada bg-* define seu próprio flex */
        }

        /* ─── ROTATING MESSAGE ──────────────────────────────────────── */
        .rotating-message {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 180;
            padding: 14px 32px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.02em;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(-20px);
            transition:
                opacity var(--tx-fast),
                transform var(--tx-fast) ease;
            background: var(--primary);
            color: var(--text);
        }

        .rotating-message.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ─── CHURCH WATERMARK ──────────────────────────────────────── */
        .church-watermark {
            position: absolute;
            bottom: 16px;
            right: 32px;
            z-index: 50;
            font-size: 14px;
            font-weight: 500;
            opacity: 0.5;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            color: var(--text);
        }

        /* ─── PDF IMAGE LAYER ───────────────────────────────────────── */
        .pdf-image-layer {
            position: absolute;
            z-index: 120;
            background: white;
            border-radius: 8px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            opacity: 0;
            transition: opacity var(--tx-fast), transform var(--tx-mid) cubic-bezier(0.22, 1, 0.36, 1);
            display: none;
        }

        .pdf-image-layer.visible {
            display: block;
            opacity: 1;
        }

        .pdf-image-layer img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Posições do PDF */
        .pdf-image-layer.pdf-pos-top-left {
            top: 24px;
            left: 24px;
        }

        .pdf-image-layer.pdf-pos-top-right {
            top: 24px;
            right: 24px;
        }

        .pdf-image-layer.pdf-pos-bottom-left {
            bottom: 24px;
            left: 24px;
        }

        .pdf-image-layer.pdf-pos-bottom-right {
            bottom: 24px;
            right: 24px;
        }

        .pdf-image-layer.pdf-pos-center {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .pdf-image-layer.pdf-pos-fullscreen {
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100% !important;
            max-height: 100vh;
            border-radius: 0;
            box-shadow: none;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pdf-image-layer.pdf-pos-fullscreen img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ─── DEBUG ─────────────────────────────────────────────────── */
        .debug-indicator {
            position: fixed;
            bottom: 8px;
            left: 8px;
            z-index: 9999;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 4px;
            font-family: monospace;
            font-size: 10px;
            color: #10b981;
            display: none;
        }

        body.debug .debug-indicator {
            display: block;
        }

        body.debug .debug-indicator.disconnected {
            color: #ef4444;
        }
    </style>
</head>

<body class="fade-on">

    <div id="watermark" class="watermark" style="display: none;">
        <img id="watermark-img" src="" alt="Logo">
    </div>

    <div id="clock" class="clock" style="display: none;">--:--</div>

    <div id="speaker-card" class="speaker-card">
        <div class="speaker-accent"></div>
        <div class="speaker-content">
            <div class="speaker-name" id="speaker-name"></div>
            <div class="speaker-role" id="speaker-role"></div>
        </div>
    </div>

    <div id="verse-ticker" class="verse-ticker">
        <div class="verse-icon" id="verse-icon">📖</div>
        <!-- verse-text-wrap existe pra que o inline span quebre linha
             dentro de um flex item com largura definida -->
        <div class="verse-text-wrap">
            <span class="verse-text" id="verse-text"></span>
        </div>
    </div>

    <div id="rotating-message" class="rotating-message"></div>

    <div id="pdf-image-layer" class="pdf-image-layer">
        <img id="pdf-image" src="" alt="PDF">
    </div>

    <div id="church-watermark" class="church-watermark"></div>

    <div class="debug-indicator" id="debug-indicator">⚫ Desconectado</div>

    <script>
        let config = {};
        let ws = null;
        let messageRotationTimer = null;
        let currentMessageIdx = 0;
        let lastLogoUrl = ''; // cache pra não recarregar imagem desnecessariamente

        let lastFontFamily = '';
        const loadedFonts = new Set(); // pra não re-injetar @font-face

        /**
         * ═════════════════════════════════════════════════════════════════
         * applyFontFamily — Aplica fonte via CSS variable.
         * ─────────────────────────────────────────────────────────────────
         * Estratégia (em ordem):
         *  1. Tenta carregar do próprio servidor de transmissão
         *     (/fonts/<NomeDaFonte>) — fontes empacotadas em
         *     src-tauri/src/fonts/.
         *  2. Se vier um caminho absoluto (custom font instalada pelo
         *     usuário), usa /fonts?path=<abs>.
         *  3. Como fallback, tenta Google Fonts (cobre Inter, Roboto,
         *     Poppins, Montserrat e ~1500 outras).
         * ═════════════════════════════════════════════════════════════════
         */
        function applyFontFamily(fontName, fontPath, fontFileName) {
            if (!fontName || fontName === lastFontFamily) return;
            lastFontFamily = fontName;

            document.documentElement.style.setProperty('--font-family', `'${fontName}'`);

            if (!loadedFonts.has(fontName)) {
                loadedFonts.add(fontName);

                let url;
                if (fontPath) {
                    // Custom font do usuário (caminho absoluto)
                    url = `/fonts?path=${encodeURIComponent(fontPath)}`;
                } else {
                    // Fonte empacotada: usa fontFileName se disponível
                    // (ex: "Inter_18pt-Regular") senão usa o nome da família
                    const lookup = fontFileName || fontName;
                    url = `/fonts/${encodeURIComponent(lookup)}`;
                }

                const style = document.createElement('style');
                style.id = `font-face-${fontName.replace(/\s+/g, '-')}`;
                style.textContent = `
                    @font-face {
                        font-family: '${fontName}';
                        src: url('${url}') format('truetype'),
                             url('${url}') format('opentype'),
                             url('${url}') format('woff2'),
                             url('${url}') format('woff');
                        font-weight: 100 900;
                        font-style: normal;
                        font-display: swap;
                    }
                `;
                document.head.appendChild(style);
            }

            // Fallback Google Fonts (só funciona pra nomes sem underscore/sufixo)
            // Normaliza o nome: "Inter_18pt" → "Inter"
            const googleName = fontName.replace(/_\d+pt$/i, '').replace(/_/g, ' ');
            const link = document.getElementById('google-font-link');
            const familyParam = googleName.replace(/\s+/g, '+');
            link.href = `https://fonts.googleapis.com/css2?family=${familyParam}:wght@400;500;600;700&display=swap`;
        }

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'd') {
                document.body.classList.toggle('debug');
            }
        });

        function connectWebSocket() {
            const wsUrl = `ws://${window.location.host}/ws`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('✅ Conectado');
                updateDebug('🟢 Conectado');
            };

            ws.onmessage = (event) => {
                try {
                    config = JSON.parse(event.data);
                    render();
                } catch (e) {
                    console.error('Erro ao parsear:', e);
                }
            };

            ws.onclose = () => {
                updateDebug('🔴 Reconectando...', true);
                setTimeout(connectWebSocket, 2000);
            };
        }

        function updateDebug(text, disconnected = false) {
            const ind = document.getElementById('debug-indicator');
            ind.textContent = text;
            ind.classList.toggle('disconnected', disconnected);
        }

        function posClass(pos) {
            return pos ? 'pos-' + pos : 'pos-top-right';
        }

        /**
         * ═════════════════════════════════════════════════════════════════
         * RENDER — Aplicação completa via setAttribute('class', '...')
         * ─────────────────────────────────────────────────────────────────
         * O bug do "estilo não troca" acontecia porque eu usava classList
         * em ordem confusa. Agora monto a string COMPLETA e aplico de uma
         * vez via setAttribute, garantindo que TODAS as classes antigas
         * sejam descartadas.
         * ═════════════════════════════════════════════════════════════════
         */
        function render() {
            if (!config) return;

            // ─── Body classes (reset total + reaplicação) ──────────────────
            const isDebug = document.body.classList.contains('debug');
            const bodyClasses = [];

            if (isDebug) bodyClasses.push('debug');
            if (config.isPaused) bodyClasses.push('paused');
            if (config.fadeTransitions !== false) bodyClasses.push('fade-on');

            if (config.chromaKey === '#00FF00') bodyClasses.push('chroma-green');
            else if (config.chromaKey === '#0000FF') bodyClasses.push('chroma-blue');
            else if (config.chromaKey === '#FF00FF') bodyClasses.push('chroma-magenta');

            if (config.showSpeakerInfo && config.speakerName &&
                (config.textPosition === 'lower-third' || config.textPosition === 'lower-half')) {
                bodyClasses.push('has-speaker-lower');
            }

            document.body.setAttribute('class', bodyClasses.join(' '));

            // ─── Tema (CSS variables) ──────────────────────────────────────
            const root = document.documentElement;
            if (config.theme) {
                root.style.setProperty('--primary', config.theme.primaryColor || '#7c3aed');
                root.style.setProperty('--accent', config.theme.accentColor || '#fbbf24');
                root.style.setProperty('--text', config.theme.textColor || '#ffffff');

                if (config.theme.fontFamily) {
                    applyFontFamily(config.theme.fontFamily, config.theme.fontPath, config.theme.fontFileName);
                }
            }

            // ─── Watermark ─────────────────────────────────────────────────
            const wmEl = document.getElementById('watermark');
            const wmImg = document.getElementById('watermark-img');

            if (config.showWatermark && config.churchInfo?.logoUrl) {
                // Resolve URL — se for asset:// ou caminho local, converte
                const resolved = resolveImageUrl(config.churchInfo.logoUrl);

                // Só atualiza se mudou (evita reload desnecessário)
                if (resolved !== lastLogoUrl) {
                    wmImg.src = resolved;
                    lastLogoUrl = resolved;
                }

                wmEl.style.display = 'block';
                wmEl.style.opacity = (config.watermarkOpacity || 70) / 100;
                wmEl.setAttribute('class', 'watermark ' + posClass(config.watermarkPosition));
            } else {
                wmEl.style.display = 'none';
            }

            // ─── Relógio ───────────────────────────────────────────────────
            const clockEl = document.getElementById('clock');
            if (config.showClock) {
                clockEl.style.display = 'block';
                clockEl.setAttribute('class', 'clock ' + posClass(config.clockPosition));
            } else {
                clockEl.style.display = 'none';
            }

            // ─── Speaker card ──────────────────────────────────────────────
            const spkEl = document.getElementById('speaker-card');
            if (config.showSpeakerInfo && config.speakerName) {
                document.getElementById('speaker-name').textContent = config.speakerName;
                document.getElementById('speaker-role').textContent = config.speakerRole || '';

                const style = config.lowerThirdStyle || 'modern';
                const textPos = config.textPosition || 'lower-third';

                // ⭐ CHAVE: setAttribute com string COMPLETA — isso força
                // o navegador a reavaliar todas as classes do zero
                spkEl.setAttribute('class',
                    `speaker-card visible style-${style} text-pos-${textPos}`);
            } else {
                spkEl.setAttribute('class', 'speaker-card');
            }

            // ─── Verse ticker ──────────────────────────────────────────────
            const verseEl = document.getElementById('verse-ticker');
            const verseTextPos = config.textPosition || 'lower-third';
            const bgStyle = config.textBackgroundStyle || 'gradient';
            const ltStyle = config.lowerThirdStyle || 'modern';
            const wrapClass = config.lineBreak ? 'wrap-on' : 'wrap-off';

            // Ícone conforme o tipo de conteúdo
            const iconMap = {
                'bible': '📖',
                'music': '🎵',
                'slide': '✦',
                'none': ''
            };
            const iconKind = config.verseTickerIcon || 'bible';
            const iconChar = iconMap[iconKind] !== undefined ? iconMap[iconKind] : '📖';
            const verseIconEl = document.getElementById('verse-icon');
            verseIconEl.textContent = iconChar;
            verseIconEl.style.display = iconChar ? '' : 'none';

            if (config.showVerseTicker && config.verseTickerText) {
                document.getElementById('verse-text').textContent = config.verseTickerText;
                verseEl.setAttribute('class',
                    `verse-ticker visible text-pos-${verseTextPos} bg-${bgStyle} style-${ltStyle} ${wrapClass}`);
            } else {
                verseEl.setAttribute('class',
                    `verse-ticker text-pos-${verseTextPos} bg-${bgStyle} style-${ltStyle} ${wrapClass}`);
            }

            // ─── Church watermark ──────────────────────────────────────────
            const churchEl = document.getElementById('church-watermark');
            if (config.churchInfo?.name && !config.showSpeakerInfo) {
                churchEl.style.display = 'block';
                churchEl.textContent = config.churchInfo.name;
            } else {
                churchEl.style.display = 'none';
            }

            // ─── PDF Image Layer ───────────────────────────────────────────
            const pdfEl = document.getElementById('pdf-image-layer');
            const pdfImg = document.getElementById('pdf-image');
            if (config.showPdfImage && config.pdfImageUrl) {
                const pos = config.pdfImagePosition || 'bottom-right';
                const size = config.pdfImageSize || 35;

                // Atualiza imagem só se mudou (evita flash)
                if (pdfImg.src !== config.pdfImageUrl) {
                    pdfImg.src = config.pdfImageUrl;
                }

                // Largura via inline style (só faz sentido fora do fullscreen)
                if (pos === 'fullscreen') {
                    pdfEl.style.width = '';
                } else {
                    pdfEl.style.width = `${size}vw`;
                    pdfEl.style.maxHeight = '90vh';
                }

                pdfEl.setAttribute('class',
                    `pdf-image-layer visible pdf-pos-${pos}`);
            } else {
                pdfEl.setAttribute('class', 'pdf-image-layer');
            }

            // ─── Rotating messages ─────────────────────────────────────────
            setupMessageRotation();
        }

        /**
         * ═════════════════════════════════════════════════════════════════
         * resolveImageUrl — Converte caminhos locais em URLs servidas
         * ─────────────────────────────────────────────────────────────────
         * O navegador do OBS NÃO acessa asset://localhost ou file://.
         * O servidor Rust serve os arquivos via /local-file?path=...
         * ═════════════════════════════════════════════════════════════════
         */
        function resolveImageUrl(url) {
            if (!url) return '';

            // Se já é http/https/data, retorna direto
            if (url.startsWith('http://') || url.startsWith('https://') || url.startsWith('data:')) {
                return url;
            }

            // Remove prefixo asset://localhost/ ou asset:// se houver
            let cleanPath = url
                .replace(/^asset:\/\/localhost\//, '/')
                .replace(/^asset:\/\//, '/')
                .replace(/^file:\/\//, '');

            // Decodifica path encoded
            cleanPath = decodeURIComponent(cleanPath);

            // Garante que começa com /
            if (!cleanPath.startsWith('/')) cleanPath = '/' + cleanPath;

            // Encoda só pra query string
            return `${window.location.origin}/local-file?path=${encodeURIComponent(cleanPath)}`;
        }

        function setupMessageRotation() {
            const msgEl = document.getElementById('rotating-message');

            if (messageRotationTimer) {
                clearInterval(messageRotationTimer);
                messageRotationTimer = null;
            }

            if (!config.showRotatingMessages || !config.rotatingMessages?.length) {
                msgEl.classList.remove('visible');
                return;
            }

            const messages = config.rotatingMessages;
            currentMessageIdx = currentMessageIdx % messages.length;

            const showMsg = (idx) => {
                msgEl.classList.remove('visible');
                setTimeout(() => {
                    msgEl.textContent = messages[idx];
                    msgEl.classList.add('visible');
                }, 400);
            };

            showMsg(currentMessageIdx);

            if (messages.length > 1) {
                const interval = (config.rotationIntervalSecs || 8) * 1000;
                messageRotationTimer = setInterval(() => {
                    currentMessageIdx = (currentMessageIdx + 1) % messages.length;
                    showMsg(currentMessageIdx);
                }, interval);
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('pt-BR', {
                hour: '2-digit', minute: '2-digit',
            });
        }
        updateClock();
        setInterval(updateClock, 1000);

        connectWebSocket();
    </script>

</body>
