name: "Rebuild macOS Only"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release a corrigir (ex: v0.9.17)'
        required: true
        default: 'v0.9.17'
      reason:
        description: 'Motivo do rebuild'
        required: false
        default: 'Correção de dependência liblzma no macOS'

jobs:
  rebuild-macos:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout tag específica
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install frontend dependencies
        run: bun install

      - name: build tauri app (macOS universal)
        env:
          LZMA_API_STATIC: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          SIGELO_UPDATER_KEY: ${{ secrets.SIGELO_UPDATER_KEY }}
          SIGELO_DECRYPT_KEY: ${{ secrets.SIGELO_DECRYPT_KEY }}
          VITE_SIGELO_DECRYPT_KEY: ${{ secrets.VITE_SIGELO_DECRYPT_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bunx tauri build --target universal-apple-darwin

      - name: Listar assets gerados
        run: |
          echo "Bundle macos:"
          ls -la "src-tauri/target/universal-apple-darwin/release/bundle/macos/" || true
          echo ""
          echo "Bundle dmg:"
          ls -la "src-tauri/target/universal-apple-darwin/release/bundle/dmg/" || true

      - name: Upload assets do Mac na release existente
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.event.inputs.tag }}

          # Sobe o .app.tar.gz e o .sig — sobrescreve o que estava na release
          gh release upload $TAG \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/Sigelo - Projeção.app.tar.gz" \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/Sigelo - Projeção.app.tar.gz.sig" \
            --clobber

          echo "Assets do Mac atualizados na release $TAG"

  update-updater-json:
    needs: rebuild-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Atualizar updater.json com novo .sig do Mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.event.inputs.tag }}
          VERSION=${TAG#v}

          echo "Aguardando propagação dos assets..."
          sleep 15

          echo "Assets disponíveis na release $TAG:"
          gh release view $TAG --json assets --jq '.assets[].name'

          echo "Baixando latest.json..."
          gh release download $TAG --pattern "latest.json" --dir . --clobber || {
            echo "::warning::latest.json não encontrado — montando updater.json manualmente a partir dos .sig"

            mkdir -p sigs
            gh release download $TAG --pattern "*.sig" --dir sigs

            echo "Sigs baixados:"
            ls -la sigs/

            MAC_SIG=$(cat "sigs/Sigelo - Projeção.app.tar.gz.sig" 2>/dev/null || echo "")
            WIN_SIG=$(cat sigs/*x64-setup.exe.sig 2>/dev/null || echo "")
            LINUX_SIG=$(cat sigs/*amd64.AppImage.sig 2>/dev/null || echo "")

            if [ -z "$MAC_SIG" ] || [ -z "$WIN_SIG" ] || [ -z "$LINUX_SIG" ]; then
              echo "::error::Uma ou mais signatures estão vazias!"
              echo "Mac:   $([ -n "$MAC_SIG" ]   && echo OK || echo VAZIO)"
              echo "Win:   $([ -n "$WIN_SIG" ]   && echo OK || echo VAZIO)"
              echo "Linux: $([ -n "$LINUX_SIG" ] && echo OK || echo VAZIO)"
              exit 1
            fi

            NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
            [ -z "$NOTES" ] && NOTES=$(awk '/^## \[/{if(/\[Unreleased\]/) next; if(flag) exit; flag=1; next} flag' CHANGELOG.md)
            [ -z "$NOTES" ] && NOTES="Nova versão do Sigelo disponível para download."
            NOTES_JSON=$(echo "$NOTES" | jq -Rs .)

            cat <<EOF > updater.json
            {
              "version": "${VERSION}",
              "notes": ${NOTES_JSON},
              "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
              "platforms": {
                "darwin-aarch64": {
                  "signature": "${MAC_SIG}",
                  "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Sigelo.-.Projecao_universal.app.tar.gz"
                },
                "darwin-x86_64": {
                  "signature": "${MAC_SIG}",
                  "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Sigelo.-.Projecao_universal.app.tar.gz"
                },
                "windows-x86_64-nsis": {
                  "signature": "${WIN_SIG}",
                  "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Sigelo.-.Projecao_${VERSION}_x64-setup.exe"
                },
                "linux-x86_64": {
                  "signature": "${LINUX_SIG}",
                  "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Sigelo.-.Projecao_${VERSION}_amd64.AppImage"
                }
              }
            }
            EOF
            gh release upload $TAG updater.json --clobber
            mkdir -p public_pages
            cp updater.json public_pages/
            exit 0
          }

          echo "Conteúdo do latest.json:"
          cat latest.json

          # Valida signatures
          WIN_SIG=$(jq -r '.platforms["windows-x86_64-nsis"].signature // ""' latest.json)
          MAC_SIG=$(jq -r '.platforms["darwin-aarch64"].signature // ""' latest.json)
          LINUX_SIG=$(jq -r '.platforms["linux-x86_64"].signature // ""' latest.json)

          echo "Validando signatures..."
          echo "Mac   (darwin-aarch64):      $([ -n "$MAC_SIG" ]   && echo OK || echo VAZIO)"
          echo "Win   (windows-x86_64-nsis): $([ -n "$WIN_SIG" ]   && echo OK || echo VAZIO)"
          echo "Linux (linux-x86_64):        $([ -n "$LINUX_SIG" ] && echo OK || echo VAZIO)"

          if [ -z "$MAC_SIG" ] || [ -z "$WIN_SIG" ] || [ -z "$LINUX_SIG" ]; then
            echo "::error::Uma ou mais signatures estão vazias!"
            exit 1
          fi

          # Extrai notas do CHANGELOG
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          [ -z "$NOTES" ] && NOTES=$(awk '/^## \[/{if(/\[Unreleased\]/) next; if(flag) exit; flag=1; next} flag' CHANGELOG.md)
          [ -z "$NOTES" ] && NOTES="Nova versão do Sigelo disponível para download."
          NOTES_JSON=$(echo "$NOTES" | jq -Rs .)

          jq --argjson notes "$NOTES_JSON" '.notes = $notes' latest.json > updater.json

          echo "updater.json final:"
          cat updater.json

      - name: Upload updater.json na release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.inputs.tag }} updater.json --clobber

      - name: Deploy to GitHub Pages
        run: |
          mkdir -p public_pages
          cp updater.json public_pages/

      - name: Deploy Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_pages
          publish_branch: gh-pages
          force_orphan: true