name: "Publish Release"

on:
  push:
    branches:
      - main # Ou a sua branch principal

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc" # Padrão Windows
            
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"   # Apple Silicon (M1/M2/M3)
            
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"    # Macs Intel (Antigos)

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

        # 1. ESTE PASSO É OBRIGATÓRIO (Instala o Bun no servidor)
      - name: setup bun
        uses: oven-sh/setup-bun@v2 # Use v2 para melhor suporte ao Windows
        with:
          bun-version: latest

      - name: install frontend dependencies
        run: bun install # Ou yarn install

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # Puxa a versão do tauri.conf.json
          releaseName: "Sigelo v__VERSION__"
          releaseBody: "Release automática gerada pelo GitHub Actions."
          releaseDraft: true
          prerelease: false