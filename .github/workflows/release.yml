name: "Publish Release"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo da build manual'
        required: false
        default: 'Build manual para teste'
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
          - platform: "macos-latest"
            target: "aarch64-apple-darwin, x86_64-apple-darwin"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install frontend dependencies
        run: bun install

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          SIGELO_UPDATER_KEY: ${{ secrets.SIGELO_UPDATER_KEY }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          SIGELO_DECRYPT_KEY: ${{ secrets.SIGELO_DECRYPT_KEY }}
          VITE_SIGELO_DECRYPT_KEY: ${{ secrets.VITE_SIGELO_DECRYPT_KEY }}

          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "Sigelo v__VERSION__"
          releaseBody: "Release automática gerada pelo GitHub Actions."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish-updater:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate updater.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF_NAME}

          # Só roda em tags — disparo manual sem tag é ignorado
          if [[ "$TAG" != v* ]]; then
            echo "::warning::Disparado sem tag (TAG=$TAG). Pulando geração do updater.json."
            exit 0
          fi

          VERSION=${TAG#v}

          echo "Aguardando a propagação dos assets..."
          sleep 15

          echo "Listando assets da release $TAG:"
          gh release view $TAG --json assets --jq '.assets[].name'

          mkdir -p sigs
          gh release download $TAG --pattern "*.sig" --dir sigs

          echo "Arquivos baixados:"
          ls -la sigs/

          MAC_SIG=$(cat sigs/*universal.app.tar.gz.sig 2>/dev/null || echo "")
          WIN_SIG=$(cat sigs/*setup.nsis.zip.sig 2>/dev/null || echo "")
          LINUX_SIG=$(cat sigs/*AppImage.tar.gz.sig 2>/dev/null || echo "")

          if [ -z "$MAC_SIG" ] || [ -z "$WIN_SIG" ] || [ -z "$LINUX_SIG" ]; then
            echo "::error::Uma ou mais assinaturas estão vazias!"
            echo "Mac: $([ -n "$MAC_SIG" ] && echo OK || echo VAZIO)"
            echo "Win: $([ -n "$WIN_SIG" ] && echo OK || echo VAZIO)"
            echo "Linux: $([ -n "$LINUX_SIG" ] && echo OK || echo VAZIO)"
            exit 1
          fi

          # Tenta pela versão exata primeiro (ex: ## [0.9.16])
          NOTES=$(awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)

          # Fallback: seção mais recente ignorando [Unreleased]
          if [ -z "$NOTES" ]; then
            echo "::warning::Versão ${VERSION} não encontrada — usando seção mais recente do CHANGELOG."
            NOTES=$(awk '/^## \[/{if(/\[Unreleased\]/) next; if(flag) exit; flag=1; next} flag' CHANGELOG.md)
          fi

          # Fallback final
          if [ -z "$NOTES" ]; then
            NOTES="Nova versão do Sigelo disponível para download."
          fi

          echo "Notas extraídas do CHANGELOG:"
          echo "$NOTES"

          NOTES_JSON=$(echo "$NOTES" | jq -Rs .)

          cat <<EOF > updater.json
          {
            "version": "${VERSION}",
            "notes": ${NOTES_JSON},
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "darwin-universal": {
                "signature": "${MAC_SIG}",
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Sigelo_${VERSION}_universal.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Sigelo_${VERSION}_x64-setup.nsis.zip"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/sigelo_${VERSION}_amd64.AppImage.tar.gz"
              }
            }
          }
          EOF

          echo "updater.json gerado:"
          cat updater.json

      - name: Upload updater.json to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} updater.json --clobber

      - name: Prepare isolated directory for GitHub Pages
        run: |
          mkdir -p public_pages
          cp updater.json public_pages/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public_pages
          publish_branch: gh-pages
          force_orphan: true