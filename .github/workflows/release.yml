name: "Publish Release"

on:
  push:
    branches:
      - main # Ou a sua branch principal

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest" # Compila o .exe/.msi
          - platform: "macos-latest"  # Compila o .dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: bun install # Ou yarn install

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # Puxa a versão do tauri.conf.json
          releaseName: "Sigelo v__VERSION__"
          releaseBody: "Release automática gerada pelo GitHub Actions."
          releaseDraft: true
          prerelease: false