name: "Publish Release"

on:
  # 1. Permite rodar manualmente pela aba "Actions" do GitHub
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo da build manual'
        required: false
        default: 'Build manual para teste'

  # 2. Só roda automaticamente ao criar uma tag de versão (ex: git tag v1.0.0)
  push:
    tags:
      - 'v*'
    # Impede que rode em pushes normais na main que não sejam tags
    branches-ignore:
      - '**'

# 3. Cancela builds em andamento se você disparar uma nova (evita gasto duplo)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc" # Padrão Windows
            
          - platform: "macos-latest"
            target: "universal-apple-darwin" # Alvo especial para binário Universal
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

        # 1. ESTE PASSO É OBRIGATÓRIO (Instala o Bun no servidor)
      - name: setup bun
        uses: oven-sh/setup-bun@v2 # Use v2 para melhor suporte ao Windows
        with:
          bun-version: latest

      - name: install frontend dependencies
        run: bun install # Ou yarn install

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A MÁGICA ACONTECE AQUI:
          SIGELO_DECRYPT_KEY: ${{ secrets.SIGELO_DECRYPT_KEY }}
          VITE_SIGELO_DECRYPT_KEY: ${{ secrets.VITE_SIGELO_DECRYPT_KEY }}


          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          
          # Variáveis para Notarização (Apple Notary Service)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # Para o Tauri 2.0, usamos APPLE_TEAM_ID para o novo serviço de notarização
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__ # Puxa a versão do tauri.conf.json
          releaseName: "Sigelo v__VERSION__"
          releaseBody: "Release automática gerada pelo GitHub Actions."
          releaseDraft: true
          prerelease: false